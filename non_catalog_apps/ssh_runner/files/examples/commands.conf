Filetype: SSH Runner Commands
Version: 1
# Global saved commands, shown for every host
Cmd: ips=   echo;ip -4 -o a|awk '$2!~/^(lo|do|br|ve)/{split($4,a,"/");print $2" /"a[2]"\n "a[1]}'
Cmd: ping=  echo;ping -O 8.8.8.8|sed -Eun "s/.*seq=([0-9]+).*time=/#\1 /p;s/no ans.*=(.*)/#\1 lost/p"
Cmd: disk=  echo;df -h / /dev/shm|awk 'NR>1{print $6,$5;print " used "$3"/"$2;print " free "$4}'
Cmd: mem=   echo;free -h|awk 'NR==2{print "mem "$3"/"$2}NR==3{print "swap "$3"/"$2}'
Cmd: os=    echo;. /etc/os-release;echo "$PRETTY_NAME";uname -rm
Cmd: wifi=  echo;nmcli -t -f ACTIVE,SSID,SIGNAL dev wifi|awk -F: '$1=="yes"{print $2" "$3"%"}'
Cmd: up=    echo;awk '{s=$1;printf "%dd %dh %dm\n",s/86400,s%86400/3600,s%3600/60}' /proc/uptime
Cmd: load=  echo;cut -d' ' -f1-3 /proc/loadavg
Cmd: date=  echo;date '+%F %T'
