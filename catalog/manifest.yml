# Template for the Flipper Apps Catalog submission.
#
# To publish: fork github.com/flipperdevices/flipper-application-catalog,
# copy this file to applications/GPIO/i2c_chipid/manifest.yml, replace
# commit_sha with the released commit, validate, then open a PR:
#
#   python -m venv venv && . venv/Scripts/activate
#   python -m pip install -r tools/requirements.txt
#   python tools/bundle.py --nolint applications/GPIO/i2c_chipid/manifest.yml bundle.zip
#
# name, id, category, version, author, icon and short_description all come
# from application.fam and deliberately are not duplicated here.
#
# NOTE before submitting: @-references and screenshot paths resolve relative
# to location.subdir, so README.md and screenshots/ must live inside
# i2c_chipid/ — not at the repository root. Move or copy them first.

sourcecode:
  type: git
  location:
    origin: https://github.com/hleserg/flipper-i2c-chipid.git
    commit_sha: REPLACE_WITH_RELEASE_COMMIT_SHA
    subdir: i2c_chipid

short_description: Identify I2C sensors by their WHO_AM_I registers and spot counterfeit modules.

description: "@README.md"
changelog: "@./docs/changelog.md"

screenshots:
  - screenshots/01_menu.png
  - screenshots/02_wiring.png
  - screenshots/03_scan_result.png
