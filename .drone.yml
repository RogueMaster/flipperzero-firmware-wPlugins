kind: pipeline
type: docker
name: "Build apps"

platform:
  os: linux
  arch: amd64

clone:
  depth: 1

steps:
  - name: "Update submodules"
    image: alpine/git
    commands: 
      - git submodule sync
      - git -c protocol.version=2 submodule update --init --force --recursive --depth 1 --jobs 4
      - git submodule foreach git config --local gc.auto 0
      - git log -1 --format='%H'

  - name: "Provide ccache"
    image: debian:bookworm-slim
    volumes:
      - name: fbt-toolchain
        path: /fbt
    commands:
      - if [ -x /fbt/bin/ccache ]; then /fbt/bin/ccache -V | head -1; exit 0; fi
      - apt-get update -qq
      - apt-get install -y -qq --no-install-recommends ca-certificates wget xz-utils
      - wget -qO /tmp/ccache.tar.xz https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz
      - tar xJf /tmp/ccache.tar.xz -C /tmp
      - mkdir -p /fbt/bin
      - cp /tmp/ccache-4.10.2-linux-x86_64/ccache /fbt/bin/ccache
      - chmod 755 /fbt/bin/ccache
      - /fbt/bin/ccache -V | head -1

  - name: "Build base pack"
    image: hfdj/fztools
    pull: never
    commands:
      - echo "T $(date -u +%T) clone start"
      - git clone --depth 1 --branch dev --recurse-submodules --shallow-submodules --jobs 8 https://github.com/DarkFlippers/unleashed-firmware.git
      - echo "T $(date -u +%T) clone done"
      - rm -rf unleashed-firmware/build/
      - rm -rf unleashed-firmware/dist/
      - rm -rf unleashed-firmware/.sconsign.dblite
      - mv base_pack/* unleashed-firmware/applications_user/
      - sh strip_name_tags.sh unleashed-firmware/applications_user
      - ./parse_api_ver.sh
      - cd unleashed-firmware
      - export FBT_GIT_SUBMODULE_SHALLOW=1
      - mkdir -p /ccache "$HOME/.config/ccache" "$HOME/.ccache"
      - printf 'cache_dir = /ccache\nmax_size = 10G\ncompression = true\n' | tee /ccache/ccache.conf "$HOME/.config/ccache/ccache.conf" > "$HOME/.ccache/ccache.conf"
      - if /fbt/bin/ccache -V >/dev/null 2>&1; then export PATH=/fbt/bin:$PATH; ccache -V | head -1; else echo "WARNING ccache unusable - building without cache"; fi
      - echo "cores - nproc $(nproc) / cgroup $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
      - ccache -p 2>/dev/null | grep -E "cache_dir|max_size" || true
      - echo "--- ccache stats BEFORE ---"; ccache -s 2>/dev/null | head -6 || true
      - echo "T $(date -u +%T) fbt start"
      - rc=0; ./fbt -j "$(nproc)" COMPACT=1 DEBUG=0 updater_package > /tmp/fbt.log 2>&1 || rc=$?; grep -E "warning:|error:|Error [0-9]|\*\*\*|FAILED|StopError|undefined reference" /tmp/fbt.log || echo "no warnings or errors"; echo "fbt log lines $(wc -l < /tmp/fbt.log)"; [ $rc -eq 0 ] || { echo "BUILD FAILED"; tail -80 /tmp/fbt.log; exit $rc; }
      - echo "T $(date -u +%T) fbt done"
      - echo "--- ccache stats AFTER ---"; ccache -s 2>/dev/null | head -14 || true
      - du -sh /ccache 2>/dev/null || true
      - mkdir artifacts-base
      - mkdir artifacts-totp
      - mkdir dist/f7-C/f7-update-local/resources
      - /fbt/toolchain/current/bin/python3 scripts/hs.py decompress dist/f7-C/f7-update-local/resources.ths -o dist/f7-C/f7-update-local/resources.tar
      - tar xf dist/f7-C/f7-update-local/resources.tar -C dist/f7-C/f7-update-local/resources
      - mv dist/f7-C/f7-update-local/resources/apps/* artifacts-base/
      - mv dist/f7-C/f7-update-local/resources/apps_data/totp/* artifacts-totp/
      - ls -laS artifacts-base
      - ls -laS artifacts-totp/plugins
      - rm -f artifacts-base/GPIO/gpio.fap
      - rm -f artifacts-base/iButton/ibutton.fap
      - rm -f artifacts-base/Infrared/infrared.fap
      - rm -f artifacts-base/NFC/nfc.fap
      - rm -f artifacts-base/NFC/mfkey.fap
      - rm -f artifacts-base/RFID/lfrfid.fap
      - rm -f artifacts-base/RFID/t5577.fap
      - rm -f artifacts-base/Sub-GHz/subghz_remote.fap
      - rm -f artifacts-base/Sub-GHz/secplus_pin.fap
      - rm -f artifacts-base/Sub-GHz/nice_o_code.fap
      - rm -f artifacts-base/Sub-GHz/seed_capturer.fap
      - rm -f artifacts-base/Sub-GHz/remote_analyzer.fap
      - rm -f artifacts-base/Tools/clock.fap
      - rm -f artifacts-base/USB/bad_usb.fap
      - rm -f artifacts-base/USB/u2f.fap
      - rm -f artifacts-base/Games/snake.fap
      - rm -f artifacts-base/USB/hid_usb.fap
      - rm -f artifacts-base/Bluetooth/hid_ble.fap
      - rm -f artifacts-base/Bluetooth/findmy.fap
      - rm -rf artifacts-base/assets
      - rm -rf artifacts-base/Scripts/
      - cd ..
      - mkdir base_pack_build
      - mv unleashed-firmware/artifacts-base/ base_pack_build
      - mkdir -p base_pack_build/apps_data/totp
      - mv unleashed-firmware/artifacts-totp/* base_pack_build/apps_data/totp/
      - sh categorize_apps.sh base_pack_build/artifacts-base
    environment:
      FBT_TOOLCHAIN_PATH: /fbt
      FBT_NO_SYNC: 1
      CCACHE_DIR: /ccache
      FBT_TOOLS_CUSTOM_LINK:
        from_secret: fbt_link
    volumes:
      - name: ccache
        path: /ccache
      - name: fbt-toolchain
        path: /fbt

  - name: "Build extra apps"
    image: hfdj/fztools
    pull: never
    commands:
      - rm -rf unleashed-firmware/dist/
      - rm -rf unleashed-firmware/applications_user/*
      - mv apps_source_code/* unleashed-firmware/applications_user/
      - mv non_catalog_apps/* unleashed-firmware/applications_user/
      - sh strip_name_tags.sh unleashed-firmware/applications_user
      - cd unleashed-firmware
      - export FBT_GIT_SUBMODULE_SHALLOW=1
      - mkdir -p /ccache "$HOME/.config/ccache" "$HOME/.ccache"
      - printf 'cache_dir = /ccache\nmax_size = 10G\ncompression = true\n' | tee /ccache/ccache.conf "$HOME/.config/ccache/ccache.conf" > "$HOME/.ccache/ccache.conf"
      - if /fbt/bin/ccache -V >/dev/null 2>&1; then export PATH=/fbt/bin:$PATH; ccache -V | head -1; else echo "WARNING ccache unusable - building without cache"; fi
      - echo "cores - nproc $(nproc) / cgroup $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a)"
      - ccache -p 2>/dev/null | grep -E "cache_dir|max_size" || true
      - echo "--- ccache stats BEFORE ---"; ccache -s 2>/dev/null | head -6 || true
      - echo "T $(date -u +%T) fbt start"
      - rc=0; ./fbt -j "$(nproc)" COMPACT=1 DEBUG=0 updater_package > /tmp/fbt.log 2>&1 || rc=$?; grep -E "warning:|error:|Error [0-9]|\*\*\*|FAILED|StopError|undefined reference" /tmp/fbt.log || echo "no warnings or errors"; echo "fbt log lines $(wc -l < /tmp/fbt.log)"; [ $rc -eq 0 ] || { echo "BUILD FAILED"; tail -80 /tmp/fbt.log; exit $rc; }
      - echo "T $(date -u +%T) fbt done"
      - echo "--- ccache stats AFTER ---"; ccache -s 2>/dev/null | head -14 || true
      - du -sh /ccache 2>/dev/null || true
      - mkdir artifacts-extra
      - mkdir dist/f7-C/f7-update-local/resources
      - /fbt/toolchain/current/bin/python3 scripts/hs.py decompress dist/f7-C/f7-update-local/resources.ths -o dist/f7-C/f7-update-local/resources.tar
      - tar xf dist/f7-C/f7-update-local/resources.tar -C dist/f7-C/f7-update-local/resources
      - mv dist/f7-C/f7-update-local/resources/apps/* artifacts-extra/
      - ls -laS artifacts-extra
      - rm -f artifacts-extra/GPIO/gpio.fap
      - rm -f artifacts-extra/iButton/ibutton.fap
      - rm -f artifacts-extra/Infrared/infrared.fap
      - rm -f artifacts-extra/NFC/nfc.fap
      - rm -f artifacts-extra/NFC/mfkey.fap
      - rm -f artifacts-extra/RFID/lfrfid.fap
      - rm -f artifacts-extra/RFID/t5577.fap
      - rm -f artifacts-extra/Sub-GHz/subghz_remote.fap
      - rm -f artifacts-extra/Sub-GHz/secplus_pin.fap
      - rm -f artifacts-extra/Sub-GHz/nice_o_code.fap
      - rm -f artifacts-extra/Sub-GHz/seed_capturer.fap
      - rm -f artifacts-extra/Sub-GHz/remote_analyzer.fap
      - rm -f artifacts-extra/Tools/clock.fap
      - rm -f artifacts-extra/USB/bad_usb.fap
      - rm -f artifacts-extra/USB/u2f.fap
      - rm -f artifacts-extra/Games/snake.fap
      - rm -f artifacts-extra/USB/hid_usb.fap
      - rm -f artifacts-extra/Bluetooth/hid_ble.fap
      - rm -f artifacts-extra/Bluetooth/findmy.fap
      - rm -rf artifacts-extra/assets
      - rm -rf artifacts-extra/Scripts/
      - cd ..
      - mkdir extra_pack_build
      - mv unleashed-firmware/artifacts-extra/ extra_pack_build
      - sh categorize_apps.sh extra_pack_build/artifacts-extra
    environment:
      FBT_TOOLCHAIN_PATH: /fbt
      FBT_NO_SYNC: 1
      CCACHE_DIR: /ccache
      FBT_TOOLS_CUSTOM_LINK:
        from_secret: fbt_link
    volumes:
      - name: ccache
        path: /ccache
      - name: fbt-toolchain
        path: /fbt

  - name: "Build apps index"
    image: python:3-alpine
    commands:
      - python3 make_apps_index.py --tag ${DRONE_TAG} --url "https://github.com/xMasterX/all-the-plugins/releases/download/{tag}/all-the-apps-{pack}.zip" base=base_pack_build/artifacts-base extra=extra_pack_build/artifacts-extra > apps_index.txt
      - echo "--- apps_index.txt (head) ---"
      - head -6 apps_index.txt

  - name: "Bundle packages"
    image: joshkeegan/zip
    commands:
      - zip -r all-the-apps-extra.zip extra_pack_build
      - zip -r all-the-apps-base.zip base_pack_build
      - tar czpf all-the-apps-extra.tgz extra_pack_build
      - tar czpf all-the-apps-base.tgz base_pack_build
      - mkdir ${DRONE_TAG}
      - mv all-the-apps-extra.zip ${DRONE_TAG}/
      - mv all-the-apps-base.zip ${DRONE_TAG}/
      - mv all-the-apps-extra.tgz ${DRONE_TAG}/
      - mv all-the-apps-base.tgz ${DRONE_TAG}/
      - mv apps_index.txt ${DRONE_TAG}/
      - rm -rf extra_pack_build
      - rm -rf base_pack_build
      - rm -rf unleashed-firmware
      - ls -laS
      - ls -laS ${DRONE_TAG}

  - name: "Do Github release"
    image: ddplugins/github-release
    pull: never
    settings:
      github_url: https://github.com
      repo_owner:
        from_secret: github_repoowner
      api_key:
        from_secret: github_apikey
      files:
        - ${DRONE_TAG}/*.tgz
        - ${DRONE_TAG}/*.zip
        - ${DRONE_TAG}/apps_index.txt
      title: ${DRONE_TAG}
      note: CHANGELOG.md
      checksum:
        - md5
        - sha1
        - crc32

volumes:
  - name: ccache
    host:
      path: /var/lib/drone/cache/unleashed-ccache
  - name: fbt-toolchain
    host:
      path: /var/lib/drone/cache/fbt-toolchain

trigger:
  event:
    - tag

node:
  typ: dev2
