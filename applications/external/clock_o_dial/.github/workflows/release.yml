name: Release

on:
  push:
    tags:
      - "v*"

env:
  CATALOG_UPSTREAM: flipperdevices/flipper-application-catalog
  CATALOG_FORK: ${{ github.repository_owner }}/flipper-application-catalog

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.build.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches fap_version and changelog.md
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FAP_VERSION=$(sed -n 's/.*fap_version="\([^"]*\)".*/\1/p' application.fam)
          if [ "$VERSION" != "$FAP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match fap_version=\"$FAP_VERSION\" in application.fam"
            exit 1
          fi
          python3 .github/scripts/changelog_section.py "$VERSION" > /dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with ufbt
        id: build
        # Fork with Node 24 action versions (node24-actions branch), until upstream merges and tags it.
        uses: ManeFunction/flipperzero-ufbt-action@19eba5a6c2c8fc7766fbcf7118aca5ef6125fd98
        with:
          sdk-channel: release

      - uses: actions/upload-artifact@v7
        with:
          name: fap
          path: ${{ steps.build.outputs.fap-artifacts }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags -- needed to diff against the previous release tag

      - uses: actions/download-artifact@v8
        with:
          name: fap
          path: dist/

      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          {
            python3 .github/scripts/changelog_section.py "${{ needs.build.outputs.version }}"
            echo ""
            echo "Built against the Release firmware SDK (\`${{ needs.build.outputs.suffix }}\`)."
            echo ""
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body
            # On the first release the whole pre-release history would be listed; changelog.md says it better.
            if [ -n "$PREV_TAG" ]; then
              echo ""
              python3 .github/scripts/categorize_changelog.py "$PREV_TAG..$GITHUB_REF_NAME"
            fi
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md

  # Pushes the submission branch to the catalog fork and links a prefilled PR. The PR itself is opened by hand:
  # fine-grained tokens can't write to a public repo you don't own, and its checklist needs a human anyway.
  catalog-submission:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FLIPPER_CATALOG_TOKEN }} # fine-grained PAT, catalog fork only, Contents: read/write
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: app

      - name: Sync catalog fork with upstream
        run: gh api --method POST "repos/$CATALOG_FORK/merge-upstream" -f branch=main

      # Cloned from the freshly synced fork, so the shallow base commit exists there and the push is accepted.
      - name: Clone catalog fork
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${CATALOG_FORK}.git" catalog
          git -C catalog config user.name "${{ github.actor }}"
          git -C catalog config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Write catalog manifest
        id: manifest
        run: |
          APP_ID=$(sed -n 's/^id: *//p' app/manifest.yml)
          CATEGORY=$(sed -n 's/^category: *//p' app/manifest.yml)
          APP_NAME=$(sed -n 's/^name: *//p' app/manifest.yml)
          COMMIT_SHA=$(git -C app rev-parse "${GITHUB_REF_NAME}^{commit}")
          DEST="applications/$CATEGORY/$APP_ID/manifest.yml"

          if [ -f "catalog/$DEST" ]; then IS_NEW=false; else IS_NEW=true; fi

          mkdir -p "catalog/$(dirname "$DEST")"
          sed "s|^\([[:space:]]*commit_sha:\).*|\1 $COMMIT_SHA|" app/manifest.yml > "catalog/$DEST"
          grep -q "commit_sha: $COMMIT_SHA" "catalog/$DEST"

          {
            echo "path=$DEST"
            echo "app-id=$APP_ID"
            echo "app-name=$APP_NAME"
            echo "is-new=$IS_NEW"
            echo "branch=${{ github.repository_owner }}/${APP_ID}_${VERSION}"
          } >> "$GITHUB_OUTPUT"

      # Same check the catalog asks authors to run before submitting (and the same Python its own CI uses).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate manifest with bundle.py
        working-directory: catalog
        run: |
          python3 -m pip install -r tools/requirements.txt
          ufbt update --channel=release
          python3 tools/bundle.py --nolint "${{ steps.manifest.outputs.path }}" "$RUNNER_TEMP/bundle.zip"

      - name: Push branch to fork
        working-directory: catalog
        run: |
          git checkout -b "${{ steps.manifest.outputs.branch }}"
          git add "${{ steps.manifest.outputs.path }}"
          git commit -m "${{ steps.manifest.outputs.app-name }} ${VERSION}"
          git push --force origin "${{ steps.manifest.outputs.branch }}"

      - name: Link a prefilled PR against the catalog
        env:
          BRANCH: ${{ steps.manifest.outputs.branch }}
          APP_NAME: ${{ steps.manifest.outputs.app-name }}
          IS_NEW: ${{ steps.manifest.outputs.is-new }}
        run: |
          EXISTING=$(gh pr list --repo "$CATALOG_UPSTREAM" --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING" ]; then
            echo "Catalog PR already open, its branch is updated: $EXISTING" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            if [ "$IS_NEW" = "true" ]; then
              sed -n 's/^short_description: *//p' app/manifest.yml
              echo ""
            fi
            python3 app/.github/scripts/changelog_section.py "$VERSION" app/changelog.md
          } > changes.md

          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, re
          from urllib.parse import quote, urlencode
          env = os.environ
          body = open("catalog/.github/PULL_REQUEST_TEMPLATE.md", encoding="utf-8").read()
          changes = open("changes.md", encoding="utf-8").read().strip()
          body = re.sub(r"^- \[ Describe your application.*$", lambda _: changes, body, count=1, flags=re.M)
          body = re.sub(r"^- \[ Describe if your application requires.*$", "- None", body, count=1, flags=re.M)
          if env["IS_NEW"] == "true":
              title = f"Add {env['APP_NAME']} {env['VERSION']}"
          else:
              title = f"Update {env['APP_NAME']} to {env['VERSION']}"
          head = f"{env['GITHUB_REPOSITORY_OWNER']}:{env['BRANCH']}"
          query = urlencode({"expand": "1", "title": title, "body": body}, quote_via=quote)
          url = f"https://github.com/{env['CATALOG_UPSTREAM']}/compare/main...{quote(head, safe=':/')}?{query}"
          print(f"Catalog branch pushed. [Open the prefilled PR]({url}), fill in the checklist and AI disclosure, then create it.")
          EOF
