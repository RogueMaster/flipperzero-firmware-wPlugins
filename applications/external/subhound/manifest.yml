# Apps Catalog manifest for Subhound.
# This file does NOT belong in this repo at runtime — copy it into your fork of
# flipperdevices/flipper-application-catalog at:
#   applications/Sub-GHz/subhound/manifest.yml
# then open a PR there.
#
# name, id, category, version, author, icon, short_description all come from
# flipper-app/application.fam — do not duplicate them here.
#
# IMPORTANT: update commit_sha below to the SHA of the commit that contains
# docs/changelog.md and the author/README fixes (i.e. AFTER you commit them).
sourcecode:
  type: git
  location:
    origin: https://github.com/maxwalks/subhound.git
    commit_sha: f61cd0363534757bd8468cd80ee0f11316f4cf29
    subdir: flipper-app
description: "@CATALOG.md"
changelog: "@./docs/changelog.md"
screenshots:
  - screenshots/ss0.png
  - screenshots/ss1.png
  - screenshots/ss2.png
  - screenshots/ss3.png
  - screenshots/ss4.png
