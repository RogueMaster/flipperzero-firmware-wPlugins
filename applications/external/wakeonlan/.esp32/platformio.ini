; Companion firmware for the official Flipper Zero WiFi dev board (ESP32-S2-WROVER).
;
; Deliberately laid out to match the three fixed offsets the ESP Flasher app
; (and the built in flasher of wol-flipper) writes to:
;   bootloader.bin -> 0x1000   (ESP32-S2 bootloader offset)
;   partitions.bin -> 0x8000
;   firmware.bin   -> 0x10000  (single factory partition, no OTA, no boot_app0)

[platformio]
; keep build output out of the repo: ufbt scans the app tree for manifests and
; trips over PlatformIO's .pio directory
build_dir = ${sysenv.TEMP}/wol-flipper-esp/build

[env:wifi_devboard]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino

board_build.mcu = esp32s2
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB

; UART0 (GPIO43 TX / GPIO44 RX) is what the Flipper header is wired to,
; so keep Serial on the hardware UART and off the native USB CDC.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
