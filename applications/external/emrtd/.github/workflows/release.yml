#
# On a v* tag: run the host suites, build the package against the release
# channel, and attach it to a GitHub release. The tests run first because a
# release that cannot pass its own vector tests has no business being
# published.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: host suites
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make the ASLR entropy fit the sanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run the suites
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: make -C tests/host test

  release:
    name: build and publish (${{ matrix.firmware }})
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      # Not fail-fast: one firmware failing to build should not withhold the
      # packages for the others.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - firmware: official
            index-url: ''
          - firmware: unleashed
            index-url: https://up.unleashedflip.com/directory.json
          - firmware: momentum
            index-url: https://up.momentum-fw.dev/firmware/directory.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with ufbt
        id: build
        uses: ./.github/actions/ufbt
        with:
          sdk-channel: release
          sdk-index-url: ${{ matrix.index-url }}

      # Every firmware produces a file called emrtd.fap. Attaching three of
      # them to one release means giving each a name that says which Flipper
      # it belongs on, otherwise the last upload silently wins.
      - name: Name the package after the firmware it is for
        id: rename
        run: |
          set -eu
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          found=0
          for f in ${{ steps.build.outputs.fap-artifacts }}; do
            [ -f "$f" ] || continue
            cp "$f" "$out/emrtd-${{ matrix.firmware }}-${{ steps.build.outputs.suffix }}.fap"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "ufbt reported no package to publish"
            exit 1
          fi
          ls -l "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      # All three jobs publish to the same release, and each one replaces its
      # text with its own body - the last job to finish writes what the page
      # says. So the body speaks for all three packages, never for the one
      # this job built.
      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.rename.outputs.dir }}/*.fap
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Packages for the official firmware, Unleashed and Momentum. Each
            file name says which firmware it is for and the API version it was
            built against.

            The launcher refuses a package built against another API version,
            which is what "App Too Old" means - take the file whose name
            matches your firmware. Copy it to /ext/apps/NFC/ on the SD card,
            or install it with `ufbt launch`.

            The changelog is in .catalog/changelog.md.
