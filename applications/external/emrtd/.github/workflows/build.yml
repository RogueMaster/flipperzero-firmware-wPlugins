#
# Builds the application package and runs the firmware's own linter over the
# sources, once for each firmware the application is published for.
#
# A package carries the API version it was built against, and the launcher
# refuses one that does not match: a package built for the official firmware
# reports "App Too Old: APP:87 < FW:88" on Unleashed. The sources are portable
# and need no change - only the SDK differs - so every target is built here
# rather than leaving anyone to rebuild it themselves.

name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fap:
    name: FAP (${{ matrix.firmware }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # An empty index URL leaves ufbt pointed at the official directory.
          - firmware: official
            index-url: ''
          - firmware: unleashed
            index-url: https://up.unleashedflip.com/directory.json
          - firmware: momentum
            index-url: https://up.momentum-fw.dev/firmware/directory.json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with ufbt
        id: build
        uses: ./.github/actions/ufbt
        with:
          sdk-channel: release
          sdk-index-url: ${{ matrix.index-url }}

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emrtd-${{ matrix.firmware }}-${{ steps.build.outputs.suffix }}
          path: ${{ steps.build.outputs.fap-artifacts }}
          if-no-files-found: error

      # The host suite compiles mbed TLS with a copy of the firmware's own
      # configuration, which is the whole reason its results say anything
      # about the device. These jobs are the only ones with an SDK deployed, so
      # they are the only place the copy can be compared with the real thing,
      # and it is worth comparing for each firmware: they ship their own mbed
      # TLS, and the day one of them enables another curve or drops a cipher,
      # PACE behaves differently there than the suite believes it does.
      #
      # STRICT=1 because a missing SDK means the step compared nothing, and a
      # check that compares nothing must not report success.
      - name: Compare the vendored mbed TLS configuration with the SDK
        run: make -C tests/host config-drift STRICT=1

      # "ufbt lint" is lint.py from the SDK: clang-format over every .c and .h
      # under the application directory, plus the file naming and permission
      # conventions. It walks tests/ as well - it skips only "lib" and hidden
      # directories - so the host suite is held to the same style as the
      # application. The sources do not vary by firmware, so once is enough.
      - name: Lint the sources
        if: matrix.firmware == 'official'
        run: ufbt lint -s
