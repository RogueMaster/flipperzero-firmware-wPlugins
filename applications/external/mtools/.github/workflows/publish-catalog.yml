name: Publish MTools to Flipper Apps Catalog

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mtools-catalog-release
  cancel-in-progress: false

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release marker and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [[ ! "$subject" =~ ^release:\ ([0-9]+\.[0-9]+)$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${BASH_REMATCH[1]}"
          fam_version="$(sed -n 's/.*fap_version="\([0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' application.fam)"
          test "$version" = "$fam_version"
          grep -Eq "^v${version}:$" CHANGELOG.md
          test -f screenshots/1.png
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-catalog:
    needs: detect-release
    if: needs.detect-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      APP_ID: mtools
      APP_CATEGORY: NFC
      CATALOG_FORK: mtoolstec/flipper-application-catalog
      CATALOG_UPSTREAM: flipperdevices/flipper-application-catalog
      VERSION: ${{ needs.detect-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with release SDK
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-channel: release

      - name: Check out Catalog fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CATALOG_FORK }}
          token: ${{ secrets.FLIPPER_CATALOG_TOKEN }}
          path: catalog-repo
          fetch-depth: 0

      - name: Prepare Catalog manifest
        shell: bash
        run: |
          set -euo pipefail
          branch="mtoolstec/${APP_ID}_${VERSION}"
          manifest="applications/${APP_CATEGORY}/${APP_ID}/manifest.yml"
          git -C catalog-repo remote add upstream "https://github.com/${CATALOG_UPSTREAM}.git" 2>/dev/null ||
            git -C catalog-repo remote set-url upstream "https://github.com/${CATALOG_UPSTREAM}.git"
          git -C catalog-repo fetch upstream main
          git -C catalog-repo checkout -B "$branch" upstream/main

          if [[ -f "catalog-repo/$manifest" ]]; then
            current_sha="$(sed -n 's/^[[:space:]]*commit_sha:[[:space:]]*\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' "catalog-repo/$manifest")"
            test -n "$current_sha"
            git fetch origin "$current_sha"
            current_version="$(git show "${current_sha}:application.fam" | sed -n 's/.*fap_version="\([0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p')"
            python3 - "$current_version" "$VERSION" <<'PY'
          import sys
          current = tuple(map(int, sys.argv[1].split('.')))
          requested = tuple(map(int, sys.argv[2].split('.')))
          if requested <= current:
              raise SystemExit('Release version must exceed the Catalog version')
          PY
          fi

          mkdir -p "catalog-repo/applications/${APP_CATEGORY}/${APP_ID}"
          sed "s/SOURCE_COMMIT_SHA/${GITHUB_SHA}/" catalog/manifest.yml > "catalog-repo/$manifest"
          echo "CATALOG_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "MANIFEST_PATH=$manifest" >> "$GITHUB_ENV"

      - name: Install Catalog validator dependencies
        run: python3 -m pip install --disable-pip-version-check -r catalog-repo/tools/requirements.txt

      - name: Validate Catalog bundle
        shell: bash
        run: |
          set -euo pipefail
          cd catalog-repo
          python3 tools/bundle.py --nolint "$MANIFEST_PATH" "$RUNNER_TEMP/mtools-${VERSION}.zip"

      - name: Commit and push Catalog branch
        shell: bash
        run: |
          set -euo pipefail
          git -C catalog-repo diff --check
          git -C catalog-repo config user.name "github-actions[bot]"
          git -C catalog-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C catalog-repo add "$MANIFEST_PATH"
          git -C catalog-repo commit -m "Add MTools ${VERSION}"
          git -C catalog-repo push --force-with-lease origin "HEAD:${CATALOG_BRANCH}"

      - name: Open Catalog pull request
        env:
          GH_TOKEN: ${{ secrets.FLIPPER_CATALOG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          existing_url="$(gh api --method GET "repos/${CATALOG_UPSTREAM}/pulls" \
            -f state=open -f head="mtoolstec:${CATALOG_BRANCH}" \
            --jq '.[0].html_url // empty')"
          if [[ -n "$existing_url" ]]; then
            echo "Catalog pull request already exists: $existing_url"
            exit 0
          fi
          body_file="$RUNNER_TEMP/catalog-pr-body.md"
          cat > "$body_file" <<EOF
          # Application Submission

          - Adds MTools ${VERSION} to the NFC category.
          - Uses Flipper Zero's built-in NFC for magic card checking and verified UID writes.
          - Source commit: ${GITHUB_SHA}.

          # Extra Requirements

          - No additional hardware is required.

          # Author Checklist (Fill this out)

          - [x] I've read the [contribution guidelines](../blob/HEAD/documentation/Contributing.md) and my PR follows them
          - [x] I own the code I'm submitting or have code owner's permission to submit it
          - [x] I have performed a self-review of my own code
          - [x] I have commented my code, particularly in hard-to-understand areas
          - [x] I [have validated](../blob/HEAD/documentation/Contributing.md#validating-manifest) the manifest file(s) with \`python3 tools/bundle.py --nolint applications/NFC/mtools/manifest.yml bundle.zip\`

          # AI usage disclosure (Fill this out)

          - Partially AI assisted - AI assistance was used to prepare release automation and Catalog metadata. The maintainers review the submission.

          # Reviewer Checklist (Don't fill this out, and don't remove it from the template)

          - [ ] Bundle is valid
          - [ ] There are no obvious issues with the source code
          - [ ] I've ran this application and verified its functionality
          EOF
          gh pr create --repo "$CATALOG_UPSTREAM" --base main \
            --head "mtoolstec:${CATALOG_BRANCH}" \
            --title "Add MTools ${VERSION}" --body-file "$body_file"
