name: Master build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ufbt:
    name: ufbt ${{ matrix.sdk-channel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sdk-channel:
          - release
          - dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build FAP
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        with:
          app-dir: .
          sdk-channel: ${{ matrix.sdk-channel }}

      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprstx-${{ matrix.sdk-channel }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
          if-no-files-found: error
