# https://github.com/flipperdevices/flipperzero-ufbt
# https://github.com/flipperdevices/flipperzero-ufbt-action

name: "FAP: Build"

on:
  workflow_dispatch:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ufbt-build:
    runs-on: ubuntu-latest
    name: "ufbt: Build for release channel"
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@ac923ebbd9c8fa1ad19c23572c89136e7151a55f # v0.1.3
        id: build-app
        with:
          sdk-channel: release

      - name: Upload app artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          # See ufbt action docs for other output variables
          name: ${{ github.event.repository.name }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
