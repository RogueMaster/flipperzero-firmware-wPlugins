name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  flipper-app:
    name: Build Flipper app (fap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ufbt
        run: pip install --upgrade ufbt
      - name: Fetch Momentum SDK
        run: ufbt update --index-url=https://up.momentum-fw.dev/firmware/directory.json --channel=release --hw-target=f7
      - name: Build fap
        working-directory: flipper/hotspot-arcade
        run: ufbt
      - uses: actions/upload-artifact@v4
        with:
          name: hotspot-arcade-fap
          path: flipper/hotspot-arcade/dist/hotspot_arcade.fap

  web-bundle:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web deps
        working-directory: web
        # Zero runtime deps (Node stdlib only); install only if a lockfile exists.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi
      - name: Build web bundle
        working-directory: web
        run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hotspot-arcade-web
          path: |
            web/dist/*.gz
            web/dist/manifest.json

  esp32-firmware:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install esp32 core 2.0.17 (S2/WROOM)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
      - name: Compile S2 + WROOM (core 2.0.17)
        # These stay pinned to 2.0.17 (different WiFi/USB behaviour on 3.x). arduino-cli
        # uses the installed core, so with only 2.0.17 present these build against it -- the
        # C5 install below would otherwise replace it and re-cut these on 3.x. AsyncTCP +
        # ESPAsyncWebServer are vendored in esp32/libs/; output goes to build/<board>/.
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s2:PartitionScheme=huge_app,PSRAM=enabled \
            --libraries esp32/libs \
            --output-dir esp32/hotspot-arcade-fw/build/official_devboard \
            esp32/hotspot-arcade-fw
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --libraries esp32/libs \
            --output-dir esp32/hotspot-arcade-fw/build/wroom \
            esp32/hotspot-arcade-fw
      - name: Compile C5 (core 3.3.11)
        # The C5 only exists in the 3.x line. Installing it REPLACES 2.0.17, so this runs
        # AFTER the S2/WROOM builds (matches release.yml). CDCOnBoot stays disabled so
        # Serial is UART0 -- the pins the Flipper uses.
        run: |
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c5:PartitionScheme=huge_app,CDCOnBoot=default \
            --libraries esp32/libs \
            --output-dir esp32/hotspot-arcade-fw/build/c5 \
            esp32/hotspot-arcade-fw
      - name: Rename images to their flashed names
        # The Flipper shows the filename while flashing and the arduino names are far
        # wider than the screen, so the artifacts carry the same short names the app
        # flashes (see each board's flash_*.txt).
        run: |
          set -eu
          for dir in esp32/hotspot-arcade-fw/build/*/; do
            board="$(basename "$dir")"
            case "$board" in official_devboard) tag=s2 ;; *) tag="$board" ;; esac
            mv "$dir/hotspot-arcade-fw.ino.bootloader.bin" "$dir/ha-boot-$tag.bin"
            mv "$dir/hotspot-arcade-fw.ino.partitions.bin" "$dir/ha-part-$tag.bin"
            mv "$dir/hotspot-arcade-fw.ino.bin"            "$dir/ha-fw-$tag.bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hotspot-arcade-firmware
          path: esp32/hotspot-arcade-fw/build/*/*.bin

  bundled-assets:
    # The fap ships the web bundle, trivia packs, and ESP firmware images as committed
    # build outputs (the app catalog builds flipper/hotspot-arcade/ alone and never runs
    # tools/build-fap.sh, so anything untracked is missing from the catalog's fap).
    # Nothing else notices when they go stale, and a stale bundle ships a broken app:
    # v0.2.0 released a fap with no firmware in it, and a later commit left v6 images in
    # a fap that required v7. This job is that missing alarm.
    name: Bundled assets are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Web bundle matches assets/web
        # Compare the DECOMPRESSED bundle: zlib emits different bytes across platforms
        # and versions for identical input, so the .gz files themselves don't match
        # between a dev machine and this runner even when the content is the same. The
        # manifest carries a CRC of the gz, which is likewise platform-dependent, so we
        # can't byte-compare it either: instead check the manifest STRUCTURE (ignoring
        # crc) and that the shipped crc actually describes the shipped gz.
        run: |
          cd web && node build.mjs && cd ..
          if ! cmp -s <(gunzip -c web/dist/index.html.gz) \
                      <(gunzip -c flipper/hotspot-arcade/assets/web/index.html.gz); then
            echo "::error::flipper/hotspot-arcade/assets/web/index.html.gz is stale. Run tools/build-fap.sh and commit the result."
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const crc32 = (b) => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) { c ^= b[i]; for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xedb88320 : c >>> 1; } return (c ^ 0xffffffff) >>> 0; };
            const strip = (s) => JSON.stringify(JSON.parse(s).map(({ crc, ...r }) => r));
            const fresh = readFileSync("web/dist/manifest.json", "utf8");
            const shipped = readFileSync("flipper/hotspot-arcade/assets/web/manifest.json", "utf8");
            if (strip(fresh) !== strip(shipped)) {
              console.error("::error::assets/web/manifest.json structure is stale. Run tools/build-fap.sh and commit the result.");
              process.exit(1);
            }
            const want = crc32(readFileSync("flipper/hotspot-arcade/assets/web/index.html.gz"));
            for (const a of JSON.parse(shipped))
              if (a.path === "/" && a.crc !== want) {
                console.error(`::error::assets/web/manifest.json crc ${a.crc} does not match crc32(assets/web/index.html.gz)=${want}. Run tools/build-fap.sh and commit the result.`);
                process.exit(1);
              }
          '

      - name: Bundle fits the Flipper's stream cap (HA_FILE_MAX)
        # web/build.mjs's CEIL and the Flipper's HA_FILE_MAX must be the same number:
        # the Flipper reads the whole gz to stream it, and when HA_FILE_MAX lagged the
        # raised ceiling the bundle was silently truncated at 60000 bytes -- every phone
        # rendered a scriptless page with no error anywhere (v1.8.0 hardware test).
        run: |
          cap=$(sed -nE 's/#define HA_FILE_MAX +\(([0-9]+)\).*/\1/p' flipper/hotspot-arcade/hotspot_arcade_i.h)
          ceil=$(sed -nE 's/const CEIL = ([0-9]+) \* ([0-9]+);.*/\1 \2/p' web/build.mjs | awk '{print $1*$2}')
          size=$(wc -c < flipper/hotspot-arcade/assets/web/index.html.gz | tr -d ' ')
          echo "HA_FILE_MAX=$cap CEIL=$ceil bundle=$size"
          if [ -z "$cap" ] || [ -z "$ceil" ]; then
            echo "::error::could not parse HA_FILE_MAX or CEIL -- fix this check's sed patterns."
            exit 1
          fi
          if [ "$cap" != "$ceil" ]; then
            echo "::error::HA_FILE_MAX ($cap) != web/build.mjs CEIL ($ceil). Keep the pair identical."
            exit 1
          fi
          if [ "$size" -gt "$cap" ]; then
            echo "::error::bundled index.html.gz ($size bytes) exceeds HA_FILE_MAX ($cap): the Flipper would refuse to stream it."
            exit 1
          fi

      - name: Content packs match assets/packs
        run: |
          for pack in packs/*/*.txt; do
            bundled="flipper/hotspot-arcade/assets/packs/${pack#packs/}"
            if ! cmp -s "$pack" "$bundled"; then
              echo "::error::$bundled is stale or missing. Run tools/build-fap.sh and commit the result."
              exit 1
            fi
          done
          if [ "$(ls -1 packs/*/*.txt | wc -l)" != "$(ls -1 flipper/hotspot-arcade/assets/packs/*/*.txt | wc -l)" ]; then
            echo "::error::assets/packs has packs that packs/ doesn't. Run tools/build-fap.sh and commit the result."
            exit 1
          fi

      - name: ESP firmware images were built from the current sources
        # The images can't be diffed (ESP-IDF embeds a build timestamp), so compare a
        # hash of the sources that produced them. See tools/asset-stamp.sh.
        run: |
          recorded=$(cat flipper/hotspot-arcade/.bundled-fw.sha256 2>/dev/null || echo missing)
          current=$(tools/asset-stamp.sh)
          if [ "$recorded" != "$current" ]; then
            echo "::error::The ESP sources changed but flipper/hotspot-arcade/assets/firmware/ wasn't rebuilt (recorded $recorded, current $current). Run tools/build-fap.sh and commit the refreshed images."
            exit 1
          fi

  simulator:
    # Compile-only guard for the local simulator (sim/), which builds the REAL game
    # engine to WebAssembly. sim/engine/Arduino.h implements exactly the Arduino
    # surface ha_games.h uses TODAY; the first time the firmware gains a String
    # method or an ESP-IDF call, the simulator stops building. Without this job that
    # failure is silent until someone next tries to run it, possibly months later.
    # Compiling is the guard — the headless tests deliberately aren't run here.
    name: Simulator engine compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 'latest' rather than a pin on purpose: the question this job answers is
      # "does the engine still build with a current toolchain", and the emcc flags
      # used (MODULARIZE / EXPORT_ES6 / EXPORTED_FUNCTIONS) have been stable for
      # years. If a future emscripten release breaks the build, that is a real
      # finding, not noise to be pinned away.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build the WASM engine
        run: sim/engine/build.sh

      - name: Confirm the build produced a loadable module
        # A zero-byte or missing artifact would otherwise pass as "compiled".
        run: |
          for f in sim/web/engine.js sim/web/engine.wasm; do
            if [ ! -s "$f" ]; then
              echo "::error::$f missing or empty after sim/engine/build.sh"
              exit 1
            fi
          done
          ls -l sim/web/engine.js sim/web/engine.wasm
