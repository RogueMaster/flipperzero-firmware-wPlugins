name: Build FAP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: host tests
    steps:
      - uses: actions/checkout@v4

      # The grading brain and the dump parser are pure logic, so they run on
      # the runner under ASan/UBSan instead of needing a Flipper.
      - name: Run host tests
        run: make -C test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    name: ufbt (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python3 -m pip install --upgrade ufbt

      - name: Sync SDK (${{ matrix.channel }})
        run: ufbt update --channel=${{ matrix.channel }}

      - name: Build RollCall
        run: ufbt

      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: rollcall-fap-${{ matrix.channel }}
          path: dist/*.fap
          if-no-files-found: error
