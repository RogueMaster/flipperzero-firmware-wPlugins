name: Build FAP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # The grade is what the user actually walks away with, and it is the one part
  # a screenshot cannot vouch for, so every threshold is checked on each push.
  test:
    runs-on: ubuntu-latest
    name: grading engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow (the asset checks read PNGs)
        run: python3 -m pip install --upgrade pillow

      - name: Run host tests
        run: make -C test

      # Both of these caught real defects that had shipped: screen strings
      # wider than the 128px they are drawn on, and a fap_version that had
      # drifted a whole release behind the header the firmware compiles.
      - name: Check every on-screen string fits 128px
        run: python3 tools_check_text.py

      - name: Check the version, icons and catalog images agree
        run: python3 tools_check_meta.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    name: ufbt (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python3 -m pip install --upgrade ufbt

      - name: Sync SDK (${{ matrix.channel }})
        run: ufbt update --channel=${{ matrix.channel }}

      - name: Build Faraday
        run: ufbt

      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: faraday-fap-${{ matrix.channel }}
          path: dist/*.fap
          if-no-files-found: error
