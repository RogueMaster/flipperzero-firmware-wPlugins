name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run PC tests
        run: |
          gcc -Wall -Wextra -Werror -o test_cepas tests/test_cepas.c cepas.c cepas_stations.c
          ./test_cepas

  build:
    name: Build .fap (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: momentum-release
            sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
            sdk-channel: release
          - name: momentum-dev
            sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json
            sdk-channel: dev
          - name: official-release
            sdk-index-url: ""
            sdk-channel: release
          - name: official-dev
            sdk-index-url: ""
            sdk-channel: dev
    steps:
      - uses: actions/checkout@v4

      - name: Build with ufbt
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
          sdk-index-url: ${{ matrix.sdk-index-url }}

      - name: Name the .fap after its firmware
        run: |
          echo "Built against API ${{ steps.build-app.outputs.api-version }} (${{ steps.build-app.outputs.suffix }})"
          cp ${{ steps.build-app.outputs.fap-artifacts }} cepas_reader-${{ matrix.name }}.fap

      - uses: actions/upload-artifact@v4
        with:
          name: cepas_reader-${{ matrix.name }}
          path: cepas_reader-${{ matrix.name }}.fap

  release:
    name: Publish release
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: faps
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CEPAS Reader ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: faps/*.fap
