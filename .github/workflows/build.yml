name: Build FAP

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # The pure decision layers - "what kind of emitter is this", "is this room
  # clean" - build and run anywhere, so they gate the firmware build.
  test:
    runs-on: ubuntu-latest
    name: host tests
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -C test

      - name: Check view layouts for overlapping draws
        run: python3 tools_check_layout.py --max 15

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    name: ufbt (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ufbt
        run: python3 -m pip install --upgrade ufbt

      - name: Sync SDK (${{ matrix.channel }})
        run: ufbt update --channel=${{ matrix.channel }}

      - name: Build Specter
        run: ufbt

      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: specter-fap-${{ matrix.channel }}
          path: dist/*.fap
          if-no-files-found: error
