name: tests

on:
  push:
  pull_request:

jobs:
  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Flipper app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-channel: release
      - name: Check C formatting
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          task: lint
          skip-setup: true

  # Test the pinned engine with the same crypto dependencies as the app.
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run the engine suite
        run: >-
          make -C lib/core/tests test
          CRYPTO_BACKEND=tiny
          TINY_CRYPTO_DIR=../../tiny-crypto-c
