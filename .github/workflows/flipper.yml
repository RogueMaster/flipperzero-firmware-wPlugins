name: Flipper app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "flipper/**"
      - ".github/workflows/flipper.yml"
  pull_request:
    paths:
      - "flipper/**"
      - ".github/workflows/flipper.yml"

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (protocol + alerts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C flipper/tests

  build:
    name: Build (${{ matrix.sdk-channel }})
    runs-on: ubuntu-latest
    needs: host-tests
    permissions:
      contents: write # tag builds attach the .fap to the release
    strategy:
      fail-fast: false
      matrix:
        sdk-channel: [release, dev]
    steps:
      - uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          app-dir: flipper
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Upload .fap
        uses: actions/upload-artifact@v4
        with:
          name: pc_health_remote-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}
      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/v') && matrix.sdk-channel == 'release'
        run: |
          mkdir -p release-assets
          cp flipper/dist/*.fap release-assets/pc_health_remote.fap
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.sdk-channel == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/pc_health_remote.fap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
