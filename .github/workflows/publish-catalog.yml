name: Publish release to Flipper Apps Catalog

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: flipper-catalog-release
  cancel-in-progress: false

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail

          subject="$(git log -1 --pretty=%s)"
          if [[ ! "$subject" =~ ^release:\ ([0-9]+\.[0-9]+)$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release marker found; Catalog publishing is skipped."
            exit 0
          fi

          version="${BASH_REMATCH[1]}"
          fam_version="$(sed -n 's/.*fap_version="\([0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' application.fam)"
          if [[ -z "$fam_version" ]]; then
            echo "Could not read fap_version from application.fam." >&2
            exit 1
          fi
          if [[ "$version" != "$fam_version" ]]; then
            echo "Commit version $version does not match application.fam version $fam_version." >&2
            exit 1
          fi
          if ! grep -Eq "^v${version}:$" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a v${version}: section." >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-catalog:
    needs: detect-release
    if: needs.detect-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      APP_ID: uhf_expansion
      APP_CATEGORY: GPIO
      CATALOG_FORK: mtoolstec/flipper-application-catalog
      CATALOG_UPSTREAM: flipperdevices/flipper-application-catalog
      VERSION: ${{ needs.detect-release.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with release SDK
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-channel: release

      - name: Check out Catalog fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CATALOG_FORK }}
          token: ${{ secrets.FLIPPER_CATALOG_TOKEN }}
          path: catalog
          fetch-depth: 0

      - name: Prepare Catalog update
        shell: bash
        run: |
          set -euo pipefail

          branch="mtoolstec/${APP_ID}_${VERSION}"
          manifest="catalog/applications/${APP_CATEGORY}/${APP_ID}/manifest.yml"

          git -C catalog remote add upstream "https://github.com/${CATALOG_UPSTREAM}.git" 2>/dev/null ||
            git -C catalog remote set-url upstream "https://github.com/${CATALOG_UPSTREAM}.git"
          git -C catalog fetch upstream main
          git -C catalog fetch origin
          git -C catalog checkout -B "$branch" upstream/main

          current_sha="$(sed -n 's/^[[:space:]]*commit_sha:[[:space:]]*\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' "$manifest")"
          if [[ -z "$current_sha" ]]; then
            echo "Could not read the current source commit from $manifest." >&2
            exit 1
          fi

          current_version="$(git show "${current_sha}:application.fam" |
            sed -n 's/.*fap_version="\([0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p')"
          if [[ -z "$current_version" ]]; then
            echo "Could not read the current Catalog version from source commit $current_sha." >&2
            exit 1
          fi

          python3 - "$current_version" "$VERSION" <<'PY'
          import sys

          current = tuple(map(int, sys.argv[1].split(".")))
          requested = tuple(map(int, sys.argv[2].split(".")))
          if requested <= current:
              raise SystemExit(
                  f"Release version {sys.argv[2]} must be higher than Catalog version {sys.argv[1]}."
              )
          PY

          python3 - "$manifest" "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          source_sha = sys.argv[2]
          text = path.read_text()
          updated, count = re.subn(
              r"(^\s*commit_sha:\s*)[0-9a-f]{40}\s*$",
              rf"\g<1>{source_sha}",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Expected one commit_sha in {path}, found {count}.")
          path.write_text(updated)
          PY

          echo "CATALOG_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "MANIFEST_PATH=applications/${APP_CATEGORY}/${APP_ID}/manifest.yml" >> "$GITHUB_ENV"

      - name: Install Catalog validator dependencies
        run: python3 -m pip install --disable-pip-version-check -r catalog/tools/requirements.txt

      - name: Validate Catalog bundle
        shell: bash
        run: |
          set -euo pipefail
          cd catalog
          python3 tools/bundle.py --nolint "$MANIFEST_PATH" "$RUNNER_TEMP/${APP_ID}-${VERSION}.zip"

      - name: Commit and push Catalog branch
        shell: bash
        run: |
          set -euo pipefail
          git -C catalog diff --check
          git -C catalog config user.name "github-actions[bot]"
          git -C catalog config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C catalog add "$MANIFEST_PATH"
          git -C catalog commit -m "Update UHF Expansion to ${VERSION}"
          git -C catalog push --force-with-lease origin "HEAD:${CATALOG_BRANCH}"

      - name: Create Catalog pull request
        env:
          GH_TOKEN: ${{ secrets.FLIPPER_CATALOG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          existing_url="$(gh api --method GET "repos/${CATALOG_UPSTREAM}/pulls" \
            -f state=open \
            -f head="mtoolstec:${CATALOG_BRANCH}" \
            --jq '.[0].html_url // empty')"
          if [[ -n "$existing_url" ]]; then
            echo "Catalog pull request already exists: $existing_url"
            exit 0
          fi

          body_file="$RUNNER_TEMP/catalog-pr-body.md"
          cat > "$body_file" <<EOF
          # Application Submission

          - Updates UHF Expansion to version ${VERSION}.
          - Uses source commit ${GITHUB_SHA} after a successful release-SDK build and Catalog bundle validation.

          # Extra Requirements

          - Requires an MTools Tec UHF Expansion or compatible UCM601 UHF reader module.
          - Uses Flipper Zero GPIO UART pins 13/14 and reset pin 16 on supported expansion revisions.

          # Author Checklist (Fill this out)

          - [x] I've read the [contribution guidelines](../blob/HEAD/documentation/Contributing.md) and my PR follows them
          - [x] I own the code I'm submitting or have code owner's permission to submit it
          - [x] I have performed a self-review of my own code
          - [x] I have commented my code, particularly in hard-to-understand areas
          - [x] I [have validated](../blob/HEAD/documentation/Contributing.md#validating-manifest) the manifest file(s) with \`python3 tools/bundle.py --nolint applications/CATEGORY/APPID/manifest.yml bundle.zip\`

          # AI usage disclosure (Fill this out)

          - Partially AI assisted - AI assistance was used to create and review the release automation and Catalog metadata preparation. Source changes are reviewed and tested by the maintainer before a release commit is pushed.

          # Reviewer Checklist (Don't fill this out, and don't remove it from the template)

          - [ ] Bundle is valid
          - [ ] There are no obvious issues with the source code
          - [ ] I've ran this application and verified its functionality
          EOF

          gh pr create \
            --repo "$CATALOG_UPSTREAM" \
            --base main \
            --head "mtoolstec:${CATALOG_BRANCH}" \
            --title "Update UHF Expansion to ${VERSION}" \
            --body-file "$body_file"

