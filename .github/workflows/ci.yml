name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: make -C test

  build-lint:
    name: Build & lint (uFBT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uFBT
        run: pip install ufbt
      - name: Fetch Flipper SDK (release channel)
        run: ufbt update --channel=release
      - name: Build the .fap
        run: ufbt
      - name: Lint (clang-format)
        run: ufbt lint
