on:
  push:
    branches: [master]
    paths-ignore:
      - "CHANGELOG.md"
      - ".changes/**"

name: release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest # needs the full ufbt toolchain to build the release FAP
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run release tool
        id: meta
        uses: OpenShock/release-tool@aea812a62e3e06228bbc4ad0a9597b4f22968893 # v0.5.1
        with:
          mode: release
          notes-output: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push commit and tag
        uses: OpenShock/actions/publish-tag@21ca2d511bca92cf24fb502fa302f82700822584 # v1.1.1
        with:
          tag: ${{ steps.meta.outputs.tag }}

      - name: Build release FAP
        if: steps.meta.outputs.tag != ''
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        id: build-release
        with:
          sdk-channel: release

      - name: Create GitHub release
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          FAP_ARTIFACTS: ${{ steps.build-release.outputs.fap-artifacts }}
        run: |
          ARGS=("$TAG" release.json "$FAP_ARTIFACTS"/* --title "$TAG" --notes-file release-notes.md)
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          gh release create "${ARGS[@]}"
