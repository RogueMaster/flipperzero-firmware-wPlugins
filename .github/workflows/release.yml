name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OFFICIAL_SDK: https://update.flipperzero.one/builds/firmware/1.5.1/flipper-z-f7-sdk-1.5.1.zip
      MOMENTUM_SDK: https://github.com/Next-Flip/Momentum-Firmware/releases/download/mntm-009/flipper-z-f7-sdk-mntm-009.zip
      MOMENTUM_012_SDK: https://github.com/Next-Flip/Momentum-Firmware/releases/download/mntm-012/flipper-z-f7-sdk-mntm-012.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Initialize pinned firmware SDKs
        run: |
          .venv/bin/ufbt update --hw-target=f7 --url="$OFFICIAL_SDK"
          make momentum-sdk
          make momentum-012-sdk
      - name: Test, build and package all three firmware variants
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release VERSION="${RELEASE_TAG#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Taiko Player $RELEASE_TAG" \
            --notes-file docs/releases/"$RELEASE_TAG".md \
            --target "$RELEASE_COMMIT" \
            dist/releases/"$RELEASE_TAG"/taiko-player-*.zip \
            dist/releases/"$RELEASE_TAG"/SHA256SUMS.txt
