name: "Release: build FAP and publish on tag"

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: dev channel
            sdk-channel: dev
          - name: release channel
            sdk-channel: release
    name: "ufbt: build for ${{ matrix.name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download FAP artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          python3 - "$TAG" <<'EOF'
          import re
          import sys

          tag = sys.argv[1].lstrip("v")
          with open("CHANGELOG.md", encoding="utf-8") as f:
              lines = f.read().splitlines()

          body = []
          started = False
          for line in lines:
              match = re.match(r"^## \[([^\]]+)\]", line)
              if match:
                  if started:
                      break
                  if match.group(1) == tag:
                      started = True
                  continue
              if started:
                  if line.startswith("___"):
                      break
                  body.append(line)

          notes = "\n".join(body).strip()
          if not notes:
              notes = (
                  f"Automatic release for tag `{sys.argv[1]}`. "
                  "No matching CHANGELOG entry was found for this version."
              )
          with open("body.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file body.md \
            dist/*.fap
