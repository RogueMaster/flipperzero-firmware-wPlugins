name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prep:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      pkg_version: ${{ steps.v.outputs.pkg_version }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - name: Parse tag
        id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # RPM/DEB disallow '-' in upstream version; '~' sorts before release
          PKG_VERSION="${TAG//-/\.}"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Tag=$TAG pkg=$PKG_VERSION prerelease=$IS_PRERELEASE"

  build-flipper:
    name: Build Flipper App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.3
        id: build-app
        with:
          sdk-channel: release

      - name: Upload .fap artifact
        uses: actions/upload-artifact@v5
        with:
          name: infrafi-fap
          path: ${{ steps.build-app.outputs.fap-artifacts }}

  build-deb:
    name: Build .deb (${{ matrix.arch }})
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            docker_platform: linux/amd64
          - arch: arm64
            docker_platform: linux/arm64
          - arch: armhf
            docker_platform: linux/arm/v7
          - arch: armel
            # Debian armel (ARMv5+, also runs on ARMv6 Pi Zero/1). There is no
            # arm/v6 Debian image and debian:bookworm no longer lists arm/v5,
            # so pull the per-arch repo directly.
            docker_platform: linux/arm/v5
            docker_image: arm32v5/debian:bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build .deb package
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/build -w /build \
            ${{ matrix.docker_image || 'debian:bookworm' }} bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential debhelper
              # Update changelog version from tag ("~" sorts before release per Debian policy)
              sed -i "1s/([^)]*)/('"${{ needs.prep.outputs.pkg_version }}"'-1)/" debian/changelog
              dpkg-buildpackage -us -uc -b
              mkdir -p output
              mv ../*.deb output/
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: deb-${{ matrix.arch }}
          path: output/*.deb

  build-rpm:
    name: Build .rpm (${{ matrix.arch }})
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker_platform: linux/amd64
          - arch: aarch64
            docker_platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build .rpm package
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/build -w /build \
            rockylinux:9 bash -c '
              set -e
              dnf install -y gcc make kernel-headers rpm-build systemd-rpm-macros
              # RPM disallows "-" in Version; tag "v0.0.1-beta" → "0.0.1~beta" (sorts before 0.0.1)
              VERSION='"${{ needs.prep.outputs.pkg_version }}"'
              # Create source tarball
              mkdir -p /root/rpmbuild/{SOURCES,SPECS}
              tar czf "/root/rpmbuild/SOURCES/infrafid-${VERSION}.tar.gz" \
                --transform "s,^\.,infrafid-${VERSION}," \
                --exclude=.git .
              cp rpm/infrafid.spec /root/rpmbuild/SPECS/
              rpmbuild -bb --define "_version ${VERSION}" /root/rpmbuild/SPECS/infrafid.spec
              mkdir -p /build/output
              cp /root/rpmbuild/RPMS/*/*.rpm /build/output/
            '

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v5
        with:
          name: rpm-${{ matrix.arch }}
          path: output/*.rpm

  release:
    needs: [prep, build-flipper, build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            packages/*.rpm
            packages/*.fap
          generate_release_notes: true
          prerelease: ${{ needs.prep.outputs.is_prerelease == 'true' }}

  # Packages are published centrally by amd989/packages, which serves
  # packages.alejandro.md. This repository builds, attaches the artifacts to
  # its own GitHub Release, and asks the publisher to pick that release up.
  # The signing key and the storage credentials live only over there.
  publish:
    needs: [prep, release]
    if: needs.prep.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish to packages.alejandro.md
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PACKAGES_DISPATCH_TOKEN is not set. The release exists, but packages.alejandro.md was not asked to publish it. Set the secret, then run the publish workflow in amd989/packages by hand for $REPO $TAG."
            exit 1
          fi
          # -f rather than -F: -F converts values that look like numbers or
          # booleans, and the publisher expects the tag as a string.
          gh api repos/amd989/packages/dispatches \
            -f event_type=publish \
            -f "client_payload[repo]=$REPO" \
            -f "client_payload[tag]=$TAG"
          {
            echo "### Asked packages.alejandro.md to publish \`$REPO\` \`$TAG\`"
            echo
            echo "Follow it at https://github.com/amd989/packages/actions/workflows/publish.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
