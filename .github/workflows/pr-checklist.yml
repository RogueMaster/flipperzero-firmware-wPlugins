name: pr-checklist

# Review each PR against the CONTRIBUTING.md checklist: hard checks (ha_proto.h agreement,
# a committed & current web bundle) fail the job; "adding a game" wiring/docs items are
# advisory reminders. Runs on `pull_request` with a read-only token (safe for fork code),
# writes the report to the run summary, and uploads it as an artifact. A separate
# pr-checklist-comment workflow (workflow_run) posts it as a sticky PR comment with a
# writable token — the secure way to comment on fork PRs without giving this job, which
# runs the PR's own web/build.mjs, write access.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PR checklist
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=100 origin "$BASE_REF"
          set +e
          BASE="origin/$BASE_REF" node tools/pr-check.mjs > checklist.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat checklist.md >> "$GITHUB_STEP_SUMMARY"

      # Hand the report + PR number to the comment workflow. The workflow_run event can't
      # read a fork PR's number, so pass it through the artifact.
      - name: Stash report + PR number
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-checklist
          path: |
            checklist.md
            pr-number.txt
          retention-days: 3

      - name: Enforce required checks
        if: steps.check.outputs.exit != '0'
        run: |
          echo "Required PR checks failed — see the checklist comment / run summary."
          exit 1
