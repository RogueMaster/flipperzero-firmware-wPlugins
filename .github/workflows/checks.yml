name: Checks

# The two things that have actually broken here, both silently:
#
#   - SUPPORTED_CHIPS.md drifting from chip_db.c. It drifted once without a
#     single chip being edited: clang-format rewrapped the table and the
#     generator quietly parsed less of it than before.
#   - Formatting. The Apps Catalog CI runs `ufbt lint` over the whole app and
#     fails on code that has never seen clang-format, which costs a round trip
#     in review rather than here.
#
# And one thing that had nothing watching it at all: until the build job below
# existed, no workflow ever compiled the app on a pull request. `ufbt lint`
# only runs clang-format. The one place the app was actually built was
# release.yml, which fires after a release is published -- so the first thing
# to notice a broken build would have been a release with .fap files missing
# from it. Three firmwares, three SDKs, and code that compiles against one can
# fail against another; that is a thing to learn on the pull request.
#
# All of it is cheap, so it runs on every pull request and on every push to
# master. A push to a branch with no pull request open runs nothing at all.
# That is deliberate -- a branch that already has a PR would otherwise be built
# twice for the same commit -- but it is worth knowing before you push a branch
# and sit waiting for checks that were never going to start. To build one
# early, dispatch it by hand:
#
#   gh workflow run checks.yml --ref <branch>

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: SUPPORTED_CHIPS.md matches chip_db.c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/gen_supported_chips.py --check

  lint:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          app-dir: fake_chip_detector
          sdk-channel: release
          task: lint

  build:
    name: build (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    strategy:
      # Same reason as in release.yml: if one firmware's SDK moves and stops
      # building, the other two results are still worth having. Knowing it
      # broke on exactly one of the three is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          # Official firmware: ufbt's default index, so no URL to give it.
          - firmware: official
            index-url: ""
          - firmware: unleashed
            index-url: https://up.unleashedflip.com/directory.json
          - firmware: momentum
            index-url: https://up.momentum-fw.dev/firmware/directory.json

    steps:
      - uses: actions/checkout@v4
      - uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          app-dir: fake_chip_detector
          # release, never dev: the same channel release.yml ships from, so a
          # green check here means the release build has the same SDK to work
          # with. No task given, which is this action's build.
          sdk-channel: release
          sdk-index-url: ${{ matrix.index-url }}
