name = "phr-telegram"
main = "worker.js"
compatibility_date = "2024-11-01"

# The deploy workflow (.github/workflows/telegram.yml) finds or creates the KV namespace "phr-telegram-PHR"
# and replaces this placeholder at deploy time. For a manual deploy: wrangler kv namespace create PHR
[[kv_namespaces]]
binding = "PHR"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Free-tier daily alert counter (issue #27). SQLite-backed Durable Objects are on the Workers Free plan
# (100k requests/day); KV free allows only 1000 writes/day, which a KV counter would burn at ~100 users.
# `wrangler deploy` creates the class from the migration below, no extra setup.
[[durable_objects.bindings]]
name = "ALERT_COUNTER"
class_name = "AlertCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertCounter"]

# /pair: at most 5 attempts per IP per minute (Workers rate limiting binding).
[[ratelimits]]
name = "PAIR_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (never commit them; the deploy workflow copies them from GitHub secrets):
#   BOT_TOKEN       - Telegram bot token from @BotFather
#   WEBHOOK_SECRET  - derived in the workflow from BOT_TOKEN, passed as secret_token to setWebhook
#   ADMIN_CHAT_ID   - Vlad's Telegram chat id, enables /stats and /refund

# Support department (overclock-lab infra/hq-desk). Uncomment after hq-desk is deployed (a binding to a missing
# Worker fails the deploy), and add HQ_TOKEN (hq-desk deploy.ps1 sets it on this Worker). Without it /support keeps
# the GitHub issues link and /paysupport stays as it is.
# [[services]]
# binding = "HQ"
# service = "hq-desk"
