name = "phr-telegram"
main = "worker.js"
compatibility_date = "2024-11-01"

# Replace the id with the output of: wrangler kv namespace create PHR
[[kv_namespaces]]
binding = "PHR"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never commit them; set with `wrangler secret put <NAME>`):
#   BOT_TOKEN       - Telegram bot token from @BotFather
#   WEBHOOK_SECRET  - value passed as secret_token to Telegram setWebhook
