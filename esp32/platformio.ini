[env:lilygo-t2can]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
# ESP32-S3-WROOM-1U N16R8: quad flash and 8 MB octal PSRAM, which takes
# GPIO 35-37. None of them is in this board's pin map; LilyGO's schematic
# also routes them to the pin header, so nothing may be wired there. Only
# the app changes, the bootloader is still qio_80m, so web OTA from an older
# build works. A module without PSRAM boots and reports 0
# (SPIRAM_IGNORE_NOTFOUND).
board_build.arduino.memory_type = qio_opi

build_flags =
    -D WEBSOCKETS_TCP_TIMEOUT=1000
    -D BOARD_LILYGO_T2CAN
    -D CAN_DRIVER_T2CAN_DUAL
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

lib_deps =
    autowp/autowp-mcp2515@1.3.1
    Links2004/WebSockets@2.7.3

# LilyGO T-2CAN FD (H784-A): the T-2CAN with an MCP2518FD instead of the
# MCP2515 on can1, run as classic CAN 2.0 at 500 kbit/s. The T-2CAN flags keep
# every other T-2CAN path; BOARD_LILYGO_T2CAN_FD only swaps the can1 driver.
[env:lilygo-t2can-fd]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
# Same ESP32-S3-WROOM-1U N16R8 as lilygo-t2can (see there).
board_build.arduino.memory_type = qio_opi

build_flags =
    -D WEBSOCKETS_TCP_TIMEOUT=1000
    -D BOARD_LILYGO_T2CAN
    -D BOARD_LILYGO_T2CAN_FD
    -D CAN_DRIVER_T2CAN_DUAL
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

lib_deps =
    pierremolinaro/ACAN2517FD@2.1.16
    Links2004/WebSockets@2.7.3

