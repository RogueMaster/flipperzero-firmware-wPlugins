[platformio]
src_dir = .firmware

# Every env pins its platform (espressif32@6.9.0, which carries the Arduino
# core) and its libraries to exact versions, so a later build reproduces the
# image that passed on the bench. Bump them deliberately.

# Shared by every env below: before each build, resolve the release version
# into FW_VERSION (see gen_version.py) and gzip the dashboard page into the
# build directory (see gen_web_page.py); after it, also emit firmware-merged.bin
# (full-flash image at offset 0) for the browser flasher (see merge_firmware.py).
[env]
extra_scripts =
    pre:gen_version.py
    pre:gen_web_page.py
    post:merge_firmware.py
# Project sources only: GCC writes a .su file beside each object with every
# function's stack frame size, which ci_check_stack.py adds up against the
# loop task's stack. Side files only, the compiled code is the same.
build_src_flags = -fstack-usage
# The firmware normally uses the shared fsd_logic as headers only. fsd_power.c
# is the one shared source it links: the 12V-feed / reset verdict and the
# flash-checkpoint schedule, pure and host-tested, behind esp32/.firmware/
# power_log.cpp (#218). Keep .firmware itself (+<*>) and add just that file.
build_src_filter =
    +<*>
    +<../../fsd_logic/fsd_power.c>

[env:m5stack-atom]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D WEBSOCKETS_TCP_TIMEOUT=1000
    -D BOARD_M5STACK_ATOM
    -D CAN_DRIVER_TWAI
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    Links2004/WebSockets@2.7.3

[env:m5stack-atom-matrix]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D WEBSOCKETS_TCP_TIMEOUT=1000
    -D BOARD_M5STACK_ATOM
    -D BOARD_M5STACK_ATOM_MATRIX
    -D CAN_DRIVER_TWAI
    -D LED_COUNT=25
    ; ATOM Matrix 5x5 SK6812 grid (vs the Lite's single LED).
    ; Front-face button is on GPIO 39, not GPIO 0 (the side BOOT button) —
    ; GPIO 39 is input-only with an external PCB pull-up, so the obvious front
    ; button finally works. Original work by @maslyankov (PR #46).
    -D PIN_BUTTON=39
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    Links2004/WebSockets@2.7.3

