# Manifest for the Flipper Apps Catalog.
#
# This file is not used by the build. Copy it into a fork of
# flipperdevices/flipper-application-catalog as
# applications/Sub-GHz/tpms_bridge/manifest.yml and open a pull request.
#
# Keep commit_sha pointing at the commit that carries the app sources and
# the screenshots being published. Bump it for every catalog update.
#
# Everything else — name, id, category, version, author, icon and the short
# description — is taken from application.fam. Paths here are relative to
# the subdir given below.
#
# Validate it from a catalog checkout with:
#   python3 tools/bundle.py --nolint \
#       applications/Sub-GHz/tpms_bridge/manifest.yml bundle.zip

sourcecode:
  type: git
  location:
    origin: https://github.com/VishovVladimir/flipper-zero-tpms.git
    commit_sha: 80c358e598ce14b76fee27d7da4c905c252f7dd1
    subdir: flipper/tpms_bridge

description: "@README.md"
changelog: "@changelog.md"
# Order matters: the first screenshot is the app preview in the catalog.
screenshots:
  - screenshots/4.png
  - screenshots/3.png
  - screenshots/2.png
  - screenshots/1.png
